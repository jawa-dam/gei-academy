<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Guild Hall</title>

<style>

body{

background:
linear-gradient(
180deg,
#05070d,
#0d1322
);

color:white;
font-family:Arial,sans-serif;

padding:40px;

}

.hero{

text-align:center;
margin-bottom:50px;

}

.guild-grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(300px,1fr)
);

gap:25px;

max-width:1400px;
margin:auto;

}

.guild-card{

background:
rgba(255,255,255,.05);

padding:25px;

border-radius:20px;

border:
1px solid rgba(
255,255,255,.08
);

}

.guild-card button{

margin-top:15px;

padding:10px 18px;

cursor:pointer;

}

.current{

max-width:800px;

margin:0 auto 40px;

padding:25px;

text-align:center;

background:
rgba(47,210,255,.08);

border-radius:20px;

}

</style>

</head>

<body>

<div class="hero">

<h1>🏛 Guild Hall</h1>

<p>

Choose your path within the GEI Universe.

</p>

</div>

<div
class="current">

<h2 id="currentGuild">

No Guild

</h2>

</div>

<div
class="guild-grid"
id="guildGrid">

</div>

<script src="../js/gei-guild-engine.js"></script>

<script>

const current =
document.getElementById(
"currentGuild"
);

current.innerText =

GEI_GUILDS.guildName();

const grid =
document.getElementById(
"guildGrid"
);

GEI_GUILDS.guilds.forEach(

guild=>{

const card =
document.createElement(
"div"
);

card.className =
"guild-card";

card.innerHTML =

`
<h2>

${guild.name}

</h2>

<p>

${guild.description}

</p>

<p>

XP Bonus:
+${guild.bonusXP}

</p>

<button
onclick="
joinGuild('${guild.id}')
">

Join Guild

</button>
`;

grid.appendChild(
card
);

}

);

function joinGuild(id){

GEI_GUILDS.join(id);

location.reload();

}


GEI_HISTORY.recordGuild(
guild
);
</script>

</body>
</html>
