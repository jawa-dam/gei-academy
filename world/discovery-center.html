<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Discovery Center</title>

<style>

body{

background:
linear-gradient(
180deg,
#05070d,
#111827
);

color:white;
font-family:Arial,sans-serif;
padding:40px;

}

.progress{

font-size:2rem;
text-align:center;
margin-bottom:40px;

}

.card{

background:
rgba(255,255,255,.05);

padding:20px;

border-radius:20px;

margin-bottom:20px;

}

.discovered{

border-left:
5px solid #2fd2ff;

}

.hidden{

opacity:.3;

}

</style>

</head>

<body>

<h1>🗺 Discovery Center</h1>

<div
class="progress"
id="progress">

0%

</div>

<div id="regions"></div>

<script src="../js/gei-world-discovery-engine.js"></script>

<script>

const container =
document.getElementById(
"regions"
);

function render(){

document.getElementById(
"progress"
).innerText =

"🌎 World Discovery " +

GEI_DISCOVERY.progress()

+

"%";

container.innerHTML="";

[
...GEI_DISCOVERY.regions,
...GEI_DISCOVERY.secretRegions

].forEach(region=>{

const div =
document.createElement(
"div"
);

const found =

GEI_DISCOVERY.isDiscovered(
region.id
);

div.className =
"card";

if(found){

div.classList.add(
"discovered"
);

}else{

div.classList.add(
"hidden"
);

}

div.innerHTML =

found

?

`
<h2>

${region.name}

</h2>

`

:

`
<h2>

❓ Unknown Region

</h2>

`;

container.appendChild(
div
);

});

}

render();

</script>

</body>
</html>
