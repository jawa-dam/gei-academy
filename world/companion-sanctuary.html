<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Companion Sanctuary</title>

<style>

body{

background:
linear-gradient(
180deg,
#05070d,
#111827
);

color:white;

font-family:Arial,sans-serif;

padding:40px;

}

.hero{

text-align:center;
margin-bottom:40px;

}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(280px,1fr)
);

gap:25px;

max-width:1400px;
margin:auto;

}

.card{

padding:25px;

border-radius:20px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(
255,255,255,.1
);

}

button{

margin-top:15px;

padding:10px 18px;

cursor:pointer;

}

.current{

max-width:900px;
margin:auto;
margin-bottom:40px;

padding:25px;

border-radius:20px;

background:
rgba(47,210,255,.08);

text-align:center;

}

</style>

</head>

<body>

<div class="hero">

<h1>🦫 Companion Sanctuary</h1>

<p>

Choose a lifelong companion.

</p>

</div>

<div class="current">

<h2 id="currentCompanion">

No Companion

</h2>

<div id="companionLevel">

Level 0

</div>

</div>

<div
class="grid"
id="companionGrid">

</div>

<script src="../js/gei-companion-engine.js"></script>

<script>

const current =
GEI_COMPANIONS.get();

if(current){

document.getElementById(
"currentCompanion"
).innerText =
current.name;

document.getElementById(
"companionLevel"
).innerText =

"Level " +
current.level;

}

const grid =
document.getElementById(
"companionGrid"
);

GEI_COMPANIONS
.companions
.forEach(companion=>{

const card =
document.createElement(
"div"
);

card.className =
"card";

card.innerHTML =

`
<h2>

${companion.name}

</h2>

<p>

${companion.role}

</p>

<p>

XP Bonus:
+${companion.bonusXP}

</p>

<button
onclick="
selectCompanion(
'${companion.id}'
)
">

Choose

</button>
`;

grid.appendChild(card);

});

function selectCompanion(id){

GEI_COMPANIONS.choose(id);

location.reload();

}

</script>

</body>
</html>
