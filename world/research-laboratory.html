<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Research Laboratory</title>

<style>

body{
background:
linear-gradient(
180deg,
#05070d,
#10192e
);

color:white;
font-family:Arial,sans-serif;
padding:40px;
}

.hero{
text-align:center;
margin-bottom:40px;
}

.grid{
display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(300px,1fr)
);

gap:20px;
}

.card{

background:
rgba(255,255,255,.05);

padding:25px;

border-radius:20px;

}

button{

padding:10px 18px;
cursor:pointer;

}

#activeResearch{

max-width:900px;

margin:auto;

margin-bottom:40px;

padding:25px;

border-radius:20px;

background:
rgba(47,210,255,.08);

}

</style>

</head>

<body>

<div class="hero">

<h1>🔬 Research Laboratory</h1>

<p>

Advance GEI civilization through discovery.

</p>

</div>

<div id="activeResearch">

<h2>

Current Research

</h2>

<div id="researchStatus">

No Active Research

</div>

</div>

<div
class="grid"
id="researchGrid">

</div>

<script src="../js/gei-research-laboratory.js"></script>

<script>

const grid =
document.getElementById(
"researchGrid"
);

GEI_RESEARCH.projects
.forEach(project=>{

const card =
document.createElement(
"div"
);

card.className =
"card";

card.innerHTML =

`
<h2>

${project.title}

</h2>

<p>

${project.description}

</p>

<p>

⭐ ${project.rewardXP} XP

<br>

🪙 ${project.rewardCoins}

</p>

<button
onclick="
startResearch(
'${project.id}'
)
">

Begin Research

</button>
`;

grid.appendChild(card);

});

function startResearch(id){

if(
GEI_RESEARCH.start(id)
){

location.reload();

}

}

function updateStatus(){

const active =

GEI_RESEARCH.activeProject();

const status =

document.getElementById(
"researchStatus"
);

if(!active){

status.innerHTML =
"No Active Research";

return;

}

const remaining =

Math.floor(

GEI_RESEARCH
.timeRemaining()

/1000

);

status.innerHTML =

`
<h3>

${active.title}

</h3>

Time Remaining:

${remaining}s
`;

const reward =

GEI_RESEARCH.complete();

if(reward){

alert(

"🔬 Research Complete!\n\n"

+

reward.title

+

"\n\n⭐ +"

+

reward.rewardXP

+

" XP"

);

location.reload();

}

}

setInterval(
updateStatus,
1000
);

updateStatus();

GEI_HISTORY.recordResearch(
project
);

</script>

</body>
</html>
