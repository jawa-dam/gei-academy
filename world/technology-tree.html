<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Technology Tree</title>

<style>

body{

background:
linear-gradient(
180deg,
#05070d,
#111827
);

color:white;

font-family:Arial,sans-serif;

padding:40px;

}

.hero{

text-align:center;

margin-bottom:40px;

}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(320px,1fr)
);

gap:25px;

}

.tech{

padding:25px;

border-radius:20px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(
255,255,255,.1
);

}

.unlocked{

border:
2px solid #2fd2ff;

}

button{

padding:10px 18px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="hero">

<h1>🔬 Technology Tree</h1>

<p>

Research civilization upgrades.

</p>

</div>

<div
class="grid"
id="techGrid">

</div>

<script src="../js/gei-technology-tree.js"></script>

<script>

const grid =
document.getElementById(
"techGrid"
);

GEI_TECH.technologies
.forEach(tech=>{

const card =
document.createElement(
"div"
);

card.className =
"tech";

if(
GEI_TECH.isUnlocked(
tech.id
)
){

card.classList.add(
"unlocked"
);

}

card.innerHTML =

`
<h2>

${tech.title}

</h2>

<p>

${tech.description}

</p>

<p>

🪙 Cost:
${tech.cost}

</p>

<button
onclick="
unlockTech(
'${tech.id}'
)
">

${
GEI_TECH.isUnlocked(
tech.id
)

?

'Unlocked'

:

'Research'
}

</button>
`;

grid.appendChild(card);

});

function unlockTech(id){

if(
GEI_TECH.unlock(id)
){

location.reload();

}
else{

alert(
"Not enough coins or already unlocked."
);

}

}
GEI_HISTORY.recordTechnology(
tech
);


</script>

</body>
</html>
