<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Leaderboard Hall</title>

<style>

body{

background:
linear-gradient(
180deg,
#05070d,
#0d1322
);

color:white;

font-family:Arial,sans-serif;

padding:40px;

}

.hero{

text-align:center;
margin-bottom:40px;

}

.hero h1{

font-size:3rem;

}

.table{

max-width:1100px;
margin:auto;

background:
rgba(255,255,255,.05);

border-radius:20px;

overflow:hidden;

}

.row{

display:grid;

grid-template-columns:
80px
1fr
1fr
1fr
1fr;

padding:15px;

border-bottom:
1px solid rgba(
255,255,255,.08
);

}

.header{

font-weight:bold;

background:
rgba(47,210,255,.15);

}

.rank1{

background:
rgba(255,215,0,.15);

}

.rank2{

background:
rgba(192,192,192,.15);

}

.rank3{

background:
rgba(205,127,50,.15);

}

</style>

</head>

<body>

<div class="hero">

<h1>🏆 Leaderboard Hall</h1>

<p>

The greatest explorers in the GEI Universe.

</p>

</div>

<div
class="table"
id="leaderboard">

</div>

<script src="../js/gei-reputation-engine.js"></script>
<script src="../js/gei-leaderboard-engine.js"></script>

<script>

GEI_LEADERBOARD.submitPlayer();

const board =
GEI_LEADERBOARD.topPlayers();

const container =
document.getElementById(
"leaderboard"
);

container.innerHTML =

`
<div class="row header">

<div>#</div>
<div>Name</div>
<div>Rank</div>
<div>XP</div>
<div>🔥</div>

</div>
`;

board.forEach(

(player,index)=>{

const row =
document.createElement(
"div"
);

row.className =
"row";

if(index===0)
row.classList.add(
"rank1"
);

if(index===1)
row.classList.add(
"rank2"
);

if(index===2)
row.classList.add(
"rank3"
);

row.innerHTML =

`
<div>

${index+1}

</div>

<div>

${player.name}

</div>

<div>

${player.rank}

</div>

<div>

${player.xp}

</div>

<div>

${player.streak}

</div>
`;

container.appendChild(
row
);

}

);

</script>

</body>
</html>
